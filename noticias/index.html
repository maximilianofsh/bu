<!DOCTYPE html>
<html lang="es" class="no-js" data-page="noticias">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Seguridad: solo se cargan scripts del propio sitio (ver SEGURIDAD.md) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' https:; frame-src https://maps.google.com https://www.google.com; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Noticias y comunicados | Colegio San Martín Iquique</title>
  <meta name="description" content="Noticias, circulares y comunicados oficiales del Colegio San Martín de Iquique.">
  <link rel="canonical" href="https://colegiosm.cl/noticias/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Colegio San Martín Iquique">
  <meta property="og:locale" content="es_CL">
  <meta property="og:url" content="https://colegiosm.cl/noticias/">
  <meta property="og:title" content="Noticias y comunicados | Colegio San Martín Iquique">
  <meta property="og:description" content="Noticias, circulares y comunicados oficiales del Colegio San Martín de Iquique.">
  <meta property="og:image" content="https://colegiosm.cl/img/compartir.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/logo/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../img/logo/favicon-192.png">
  <link rel="apple-touch-icon" href="../img/logo/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/colores.css">
  <link rel="stylesheet" href="../css/paginas/noticias.css">
  <script src="../js/estilo.js"></script>
</head>
<body data-page="noticias" id="top">
  <script src="../js/layout.js"></script>

  <main id="contenido">

    <section class="page-hero">
      <div class="hero__pattern" aria-hidden="true"></div>
      <div class="container page-hero__inner">
        <nav aria-label="Ruta"><ol class="crumbs"><li><a href="../">Inicio</a></li><li aria-current="page">Noticias y comunicados</li></ol></nav>
        <h1>Noticias y comunicados</h1>
        <p>Circulares, comunicados oficiales y novedades de nuestra comunidad educativa.</p>
      </div>
    </section>

    <!-- Noticias -->
    <section class="section">
      <div class="container">
        <header class="section__head section__head--row reveal">
          <div>
            <p class="eyebrow">Actualidad</p>
            <h2 class="title">Todas las publicaciones</h2>
          </div>
          <div class="filters" role="group" aria-label="Filtrar noticias">
            <button class="chip is-active" data-filter="todas">Todas</button>
            <button class="chip" data-filter="comunicado">Comunicados</button>
            <button class="chip" data-filter="pedagogia">Pedagogía</button>
            <button class="chip" data-filter="comunidad">Comunidad</button>
          </div>
        </header>
        <div class="news-tools reveal" role="search">
          <label class="news-tools__buscar">
            <span class="sr-only">Buscar noticias</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
            <input type="search" id="newsBuscar" placeholder="Buscar por palabra…" autocomplete="off">
          </label>
          <select id="newsDepto" aria-label="Departamento o equipo" hidden></select>
          <select id="newsAnio" aria-label="Año" hidden></select>
        </div>
        <p class="news-tools__total" id="newsTotal" aria-live="polite"></p>
        <div class="news" id="news"></div>
        <div class="center">
          <button class="btn btn--outline" id="moreNews">Ver más noticias</button>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/redes.js"></script>
  <script src="../js/texto.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
