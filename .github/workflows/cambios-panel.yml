# Revisa y publica los cambios que los funcionarios envían desde el panel /admin/
# (ver .github/scripts/aplicar-cambios.js). Solo atiende ramas «panel-…».
name: Cambios del panel

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: write

concurrency:
  group: cambios-panel
  cancel-in-progress: false

jobs:
  revisar:
    if: startsWith(github.event.pull_request.head.ref, 'panel-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Se descarga main (no la solicitud): el código de la solicitud nunca se ejecuta
      # Versiones fijadas por su código exacto (no pueden cambiar a escondidas); Dependabot avisa de nuevas versiones
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const aplicar = require("./.github/scripts/aplicar-cambios.js");
            await aplicar({ github, context, core });
